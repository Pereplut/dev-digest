# Server integration suite — the DB-backed test files (`*.it.test.ts`).
#
# Each spins up a real Postgres (pgvector) via testcontainers, builds the
# Fastify app, migrates + seeds, and exercises the routes end-to-end against
# the DB.
#
# The tests self-skip when Docker is unavailable (`dockerAvailable()`), which is
# right for a laptop but wrong for CI: a skipped suite still exits 0, so a
# Docker regression on the runner is indistinguishable from a green run. This
# job therefore ASSERTS Docker before running them. (Observed locally: two runs
# minutes apart on the same commit, one reporting `2 skipped`, the next 30/30 —
# the probe is racy, so "it passed" is not enough on its own.)
#
# Linux only — testcontainers needs a Linux Docker daemon (Windows runners
# don't provide one).
name: server integration

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/server-integration.yml'
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/server-integration.yml'

permissions:
  contents: read

concurrency:
  group: server-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: tests (postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # Integration tests load server src, which imports @devdigest/reviewer-core
      # (../reviewer-core/src) → which imports `openai`/`zod`. Install reviewer-core's
      # deps so those resolve at module load. reviewer-core uses npm (see reviewer-core.yml).
      - name: Install reviewer-core deps
        working-directory: reviewer-core
        run: npm ci

      # Fail loudly if Docker is missing rather than letting every suite
      # self-skip to a green no-op.
      - name: Assert Docker is available
        run: |
          docker info > /dev/null 2>&1 || {
            echo "::error::Docker is not available — the integration tests would self-skip and still exit 0."
            exit 1
          }

      # Inlined rather than `pnpm test:integration`: server/package.json may be
      # skip-worktree in some clones, so we don't rely on the committed file
      # carrying the split script. The `.it.test` filter selects the DB-backed
      # files. vitest's config gives these a 120s timeout for container spin-up;
      # no API keys needed — LLM/git are mocked.
      - run: pnpm exec vitest run .it.test

      # A suite that self-skips exits 0, so assert none were skipped. `--reporter
      # json` is written to a file and inspected rather than trusting the exit
      # code alone.
      - name: Assert no suite self-skipped
        run: |
          pnpm exec vitest run .it.test --reporter=json --outputFile=/tmp/it.json > /dev/null 2>&1 || true
          skipped=$(node -e "const r=require('/tmp/it.json');console.log((r.numPendingTests??0)+(r.numTodoTests??0))")
          echo "skipped tests: $skipped"
          if [ "$skipped" != "0" ]; then
            echo "::error::$skipped integration test(s) were skipped — Docker or a gate is silently disabling coverage."
            exit 1
          fi
