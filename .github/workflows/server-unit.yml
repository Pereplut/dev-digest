# Server unit suite — Fastify API (@devdigest/api), hermetic tests only.
#
# Two jobs:
#  - typecheck: type-check on Linux only — the platform CI and the exported
#    agent-runner both run on. We deliberately do NOT matrix over Windows/macOS:
#    macOS is covered by daily local dev, Windows is not a ship target, and
#    `@ast-grep/napi` is exact-pinned so its native binary only changes on a
#    deliberate version bump.
#  - unit: the 16 DB-free test files (everything that is NOT `*.it.test.ts`).
#    LLM/git/embeddings are mocked via src/adapters/mocks.ts — no Docker.
#
# DB-backed tests run in server-integration.yml. reviewer-core/** is in the
# path filter because server aliases ../reviewer-core/src at type-check time.
name: server unit

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'reviewer-core/**'
      - '.github/workflows/server-unit.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'reviewer-core/**'
      - '.github/workflows/server-unit.yml'

permissions:
  contents: read

concurrency:
  group: server-unit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # The server type-checks reviewer-core's RAW source: tsconfig aliases
      # @devdigest/reviewer-core → ../reviewer-core/src, and platform/structured.ts
      # re-exports from it. That source imports `openai`/`zod`, so without
      # reviewer-core's deps installed, tsc fails with TS2307 → cascading
      # unknown→T errors. reviewer-core uses npm (see reviewer-core.yml).
      - name: Install reviewer-core deps
        working-directory: reviewer-core
        run: npm ci

      - run: pnpm typecheck

      # eslint and depcruise are invoked directly rather than via `pnpm lint`
      # (which runs both), for the same reason the unit job inlines vitest: the
      # committed package.json is not guaranteed to carry the scripts in every
      # clone. Keep these two steps in step with the `lint` script.
      - run: pnpm exec eslint .

      # Architecture boundaries (the onion rings). `pnpm lint` runs this locally
      # via the `arch` script, but CI calls eslint directly, so without this step
      # the boundary rules never gate a PR. Exit code = number of violations.
      - name: Architecture boundaries (dependency-cruiser)
        run: pnpm exec depcruise src --output-type err-long

      # Dependency advisories. NON-BLOCKING on purpose: `pnpm audit
      # --audit-level=high` currently exits 1 in this package (20 high + 1
      # critical, almost all transitive — e.g. fastify > @fastify/ajv-compiler >
      # fast-uri), so making it a gate would turn every PR red on day one.
      # It reports here so the list is visible and shrinking; promote it to a
      # blocking step once the transitive advisories are cleared.
      - name: Dependency audit (report only)
        continue-on-error: true
        run: pnpm audit --audit-level=high

  unit:
    name: tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # The unit tests load server src, which imports @devdigest/reviewer-core
      # (../reviewer-core/src) → which imports `openai`/`zod`. Install reviewer-core's
      # deps so those resolve at module load. reviewer-core uses npm (see reviewer-core.yml).
      - name: Install reviewer-core deps
        working-directory: reviewer-core
        run: npm ci

      # Inlined rather than `pnpm test:unit`: server/package.json MAY be
      # skip-worktree in some clones, so the committed file is not guaranteed to
      # carry the split scripts. (It is NOT skip-worktree in the canonical clone
      # — `git ls-files -v server/package.json` returns `H`, not `S` — so this
      # is a precaution, not a fact about the repo. See server/INSIGHTS.md.)
      - run: pnpm exec vitest run --exclude '**/*.it.test.ts'
